name: create_eset
namespace: "eset"
authors:
  - __merge__: /src/base/authors/dries_schaumont.yaml
    roles: [ maintainer ]
  - __merge__: /src/base/authors/marijke_van_moerbeke.yaml
    roles: [ author ]
  - __merge__: /src/base/authors/katarzyna_gorczak.yaml
    roles: [ author ]
argument_groups:
  - name: "Arguments"
    arguments:
    - type: file
      name: "--pDataFile"
      required: true
    - type: file
      name: "--fDataFile"
      required: true
    - type: file
      name: "--mappingDir"
      multiple: true
      required: true
    - type: string
      name: --poolName
      required: true
    - name: "--output"
      type: file
      required: true
      direction: output
      default: eset.$id.rds
resources:
  - type: r_script
    path: script.R
test_resources:
  - type: r_script
    path: test.R
  - path: test_data/pData.tsv
  - path: test_data/fData.tsv
  - path: test_data/mapping_dir
engines:
  - type: docker
    image: rocker/r2u:26.04
    setup:
      # This avoids an issue with nextflow https://github.com/nextflow-io/nextflow/issues/7114
      # that is caused by a bug in the rust implementation of coreutils. This will be fixed
      # in a future release of Ubuntu: see https://bugs.launchpad.net/ubuntu/+source/rust-coreutils/+bug/2150342
      # To check if the fix has been released, compare the output from `date +%s%3N` and
      # `gnudate +%s%3N` in a fresh `rocker/r2u:26.04` container.
      # The output should have the same number of digits in case the fix has been applied.
      - type: docker
        run: |
          apt update && \
            DEBIAN_FRONTEND=noninteractive apt install -y coreutils-from-gnu coreutils-from-uutils- --allow-remove-essential && \
            rm -rf /var/lib/apt/lists/*
      - type: r
        cran:
          - data.table
          - nlcv
        bioc:
          - Seurat
    test_setup:
      - type: r
        cran:
          - testthat
runners:
  - type: executable
  - type: nextflow

      